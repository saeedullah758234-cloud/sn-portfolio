<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>SN Portfolio | Saeed ullah & Naeem ur Rahman</title>
    <meta name="description" content="Official SN Portfolio of Saeed ullah (Web Developer) and Naeem ur Rahman (Video Editor). Explore our professional projects and services.">
    <meta name="keywords" content="SN Portfolio, Saeed ullah, Naeem ur Rahman, Web Developer, Video Editor, SNPortfolio, Portfolio Website">
    <meta name="author" content="SN Portfolio">
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph for Social Media (WhatsApp/Facebook preview) -->
    <meta property="og:title" content="SN Portfolio | Professional Showcase">
    <meta property="og:description" content="Meet Saeed ullah & Naeem ur Rahman - Experts in Web Development and Video Editing.">
    <meta property="og:image" content="https://sn-portfolio-theta.vercel.app/favicon.ico">
    <meta property="og:url" content="https://sn-portfolio-theta.vercel.app">

    <!-- Google Fonts & CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        /* Preloader Fix for PC/Mobile */
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        body[data-theme="dark"] #preloader { background: #0f172a; }
        #preloader.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .card-banner {
            height: 120px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #e2e8f0;
            border-radius: 15px 15px 0 0;
        }
        [data-theme="dark"] .card-banner { background-color: #1e293b; }
    </style>
</head>
<body>
    <!-- Preloader -->
    <div id="preloader">
        <div class="spinner"></div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button id="theme-btn" aria-label="Toggle Theme">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- Main Hero -->
    <header class="hero">
        <div class="container">
            <div class="hero-content fade-in">
                <h1 class="glitch" data-text="SN PORTFOLIO">SN PORTFOLIO</h1>
                <p class="subtitle">Creative Solutions & Digital Excellence</p>
                <div class="hero-btns">
                    <a href="about.html" class="btn btn-primary">About Us</a>
                    <a href="login.html" class="btn btn-outline">Admin Login</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Profiles Section -->
    <section class="profiles section">
        <div class="container">
            <div class="section-title">
                <h2>Our Professionals</h2>
                <div class="underline"></div>
            </div>

            <div class="profile-grid">
                <!-- Saeed's Card -->
                <div class="profile-card slide-up" onclick="location.href='portfolio.html?user=saeed'">
                    <div id="home-saeed-banner" class="card-banner"></div>
                    <div class="card-header">
                        <img id="home-saeed-img" src="https://via.placeholder.com/150" alt="Saeed ullah" class="profile-img">
                    </div>
                    <div class="card-body">
                        <h3 id="home-saeed-name">Saeed ullah</h3>
                        <p id="home-saeed-title" class="role">Web Developer</p>
                        <p id="home-saeed-intro" class="bio">Loading expert profile...</p>
                        <a href="portfolio.html?user=saeed" class="btn btn-sm">View Portfolio</a>
                    </div>
                </div>

                <!-- Naeem's Card -->
                <div class="profile-card slide-up" style="animation-delay: 0.2s" onclick="location.href='portfolio.html?user=naeem'">
                    <div id="home-naeem-banner" class="card-banner"></div>
                    <div class="card-header">
                        <img id="home-naeem-img" src="https://via.placeholder.com/150" alt="Naeem ur Rahman" class="profile-img">
                    </div>
                    <div class="card-body">
                        <h3 id="home-naeem-name">Naeem ur Rahman</h3>
                        <p id="home-naeem-title" class="role">Video Editor</p>
                        <p id="home-naeem-intro" class="bio">Loading expert profile...</p>
                        <a href="portfolio.html?user=naeem" class="btn btn-sm">View Portfolio</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2024 SN Portfolio. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Inline Fail-safe for preloader
        window.addEventListener('load', () => {
            setTimeout(() => {
                const pre = document.getElementById('preloader');
                if(pre) pre.classList.add('hidden');
            }, 500);
        });
        setTimeout(() => {
            const pre = document.getElementById('preloader');
            if(pre) pre.classList.add('hidden');
        }, 2500);
    </script>
</body>
