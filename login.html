<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | SN Studio Dashboard</title>
    
    <meta name="description" content="Secure Admin Login for Saeed ullah and Naeem ur Rahman.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css?v=6.0">
    <link rel="stylesheet" href="css/admin.css?v=6.0">
    <link rel="stylesheet" href="css/animations.css?v=6.0">

    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card animate-scaleUp">
            
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Admin Login</h2>
                <p>Select your profile to access dashboard controls.</p>
            </div>

            <!-- Profile Selector Buttons -->
            <div class="login-user-selector">
                <button type="button" class="selector-btn active" id="selectSaeedBtn" onclick="switchUserTab('saeed')">
                    <i class="fa-solid fa-user-gear"></i> <span>Saeed ullah</span>
                </button>
                <button type="button" class="selector-btn" id="selectNaeemBtn" onclick="switchUserTab('naeem')">
                    <i class="fa-solid fa-video"></i> <span>Naeem ur Rahman</span>
                </button>
            </div>

            <!-- Fast Direct Form -->
            <form id="loginForm" onsubmit="return handleAdminLogin(event)">
                <input type="hidden" id="selectedUserKey" value="saeed">

                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" value="saeedullah" required autocomplete="username">
                </div>

                <div class="form-group mb-4">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" value="saeed123" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" class="text-muted text-sm" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Return to Public Site
                </a>
            </div>

        </div>
    </div>

    <!-- Instant 0-Delay Script -->
    <script>
        function switchUserTab(userKey) {
            var saeedBtn = document.getElementById('selectSaeedBtn');
            var naeemBtn = document.getElementById('selectNaeemBtn');
            var userKeyInput = document.getElementById('selectedUserKey');
            var usernameInput = document.getElementById('username');
            var passwordInput = document.getElementById('password');

            if (userKey === 'naeem') {
                if (saeedBtn) saeedBtn.classList.remove('active');
                if (naeemBtn) naeemBtn.classList.add('active');
                if (userKeyInput) userKeyInput.value = 'naeem';
                if (usernameInput) usernameInput.value = 'naeemurrahman';
                if (passwordInput) passwordInput.value = 'naeem123';
            } else {
                if (naeemBtn) naeemBtn.classList.remove('active');
                if (saeedBtn) saeedBtn.classList.add('active');
                if (userKeyInput) userKeyInput.value = 'saeed';
                if (usernameInput) usernameInput.value = 'saeedullah';
                if (passwordInput) passwordInput.value = 'saeed123';
            }
        }

        function handleAdminLogin(e) {
            if (e && e.preventDefault) e.preventDefault();

            var userKeyInput = document.getElementById('selectedUserKey');
            var usernameInput = document.getElementById('username');
            var key = userKeyInput ? userKeyInput.value : 'saeed';
            var uname = (usernameInput ? usernameInput.value : '').trim().toLowerCase();

            var isNaeem = (key === 'naeem') || uname.includes('naeem');

            if (isNaeem) {
                localStorage.setItem('sn_logged_in', 'true');
                localStorage.setItem('sn_user', 'naeem');
                localStorage.setItem('sn_user_name', 'Naeem ur Rahman');
            } else {
                localStorage.setItem('sn_logged_in', 'true');
                localStorage.setItem('sn_user', 'saeed');
                localStorage.setItem('sn_user_name', 'Saeed ullah');
            }

            // Direct Instant 0-Delay Redirect
            window.location.replace('dashboard.html');
            return false;
        }

        // Auto-check if already logged in
        if (localStorage.getItem('sn_logged_in') === 'true') {
            window.location.replace('dashboard.html');
        }
    </script>
</body>
</html>
