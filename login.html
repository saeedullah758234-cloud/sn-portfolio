<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | SN Studio Dashboard</title>
    
    <meta name="description" content="Secure Admin Login for Saeed ullah and Naeem ur Rahman. Manage portfolio content, projects, and profile settings.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/style.css?v=3.0">
    <link rel="stylesheet" href="css/admin.css?v=3.0">
    <link rel="stylesheet" href="css/animations.css?v=3.0">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card animate-scaleUp">
            
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Admin Login</h2>
                <p>Select your user profile to access dashboard controls.</p>
            </div>

            <!-- Profile Selector Buttons -->
            <div class="login-user-selector">
                <button type="button" class="selector-btn active" id="selectSaeedBtn" data-user="saeed">
                    <i class="fa-solid fa-user-gear"></i> Saeed ullah
                </button>
                <button type="button" class="selector-btn" id="selectNaeemBtn" data-user="naeem">
                    <i class="fa-solid fa-video"></i> Naeem ur Rahman
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" autocomplete="on">
                <input type="hidden" id="selectedUserKey" value="saeed">

                <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" value="saeedullah" required autocomplete="username">
                </div>

                <div class="form-group mb-4">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" value="saeed123" required autocomplete="current-password">
                </div>

                <!-- Error Container -->
                <div id="loginError" class="alert alert-danger hidden mb-3" style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem;">
                    <i class="fa-solid fa-circle-exclamation"></i> <span id="errorText">Invalid username or password.</span>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" class="text-muted text-sm" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left"></i> Return to Public Site
                </a>
            </div>

        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/database.js?v=3.0"></script>
    <script src="js/auth.js?v=3.0"></script>
</body>
</html>
