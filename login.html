<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - S&N Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-primary);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px var(--shadow-color);
            text-align: center;
        }
        .login-logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        .login-logo span:first-child { color: var(--accent-primary); }
        .login-logo span:last-child { color: var(--accent-secondary); }
        
        .login-desc {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 15px;
            transition: var(--transition);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.1);
        }
        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card fade-in">
            <div class="login-logo"><span>S&N</span> Admin</div>
            <p class="login-desc">Enter your credentials to access the dashboard</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. saeedullah" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <div id="login-error" class="error-msg">Invalid username or password!</div>
                
                <button type="submit" class="btn primary-btn" style="width: 100%; justify-content: center; margin-top: 15px;">
                    <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                </button>
            </form>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Public Website</a>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
