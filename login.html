<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - S&N Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-primary);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow-color);
        }
        .login-logo {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-logo span:first-child { color: var(--accent-primary); }
        .login-logo span:last-child { color: var(--accent-secondary); }
        
        .login-desc {
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
        }
        .error-msg {
            color: var(--error);
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo"><span>S&N</span> Admin Login</div>
            <p class="login-desc">Sign in to manage your portfolio</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="saeedullah OR naeemurrahman" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>
                
                <div id="login-error" class="error-msg">Invalid credentials!</div>
                
                <button type="submit" class="btn primary-btn" style="width: 100%; justify-content: center; margin-top: 10px;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Main Website</a>
        </div>
    </div>

    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
