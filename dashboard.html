<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&N Portfolio - Profile</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Full Centered Preloader -->
    <div class="preloader">
        <div class="spinner"></div>
        <h2><span>S</span>&<span>N</span></h2>
    </div>

    <!-- Particles Background -->
    <div id="particles-js"></div>

    <!-- Desktop Header -->
    <header>
        <nav>
            <a href="index.html" class="logo"><span>S&N</span> Portfolio</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="portfolio.html?user=saeed" id="nav-saeed">Saeed (Web)</a></li>
                <li><a href="portfolio.html?user=naeem" id="nav-naeem">Naeem (Video)</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <button class="menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </nav>
    </header>

    <main>
        <!-- Profile Header Section -->
        <section class="portfolio-header" data-aos="fade-up">
            <div class="profile-img">
                <img id="profile-image" src="https://via.placeholder.com/150" alt="Profile">
            </div>
            <h1 id="profile-name">Loading Profile...</h1>
            <h3 class="role" id="profile-title">Please wait...</h3>
            
            <div class="contact-info">
                <div class="info-item" id="profile-email">
                    <i class="fas fa-envelope"></i> Loading...
                </div>
                <div class="info-item" id="profile-bank">
                    <i class="fas fa-university"></i> Loading...
                </div>
            </div>

            <p id="profile-desc" style="max-width: 600px; margin: 20px auto; color: var(--text-secondary);">
                Loading profile description...
            </p>

            <div style="margin-top: 20px;">
                <a href="#" id="whatsapp-btn" class="btn whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i> WhatsApp Me
                </a>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="projects-section">
            <h2 class="section-title" data-aos="fade-up">My <span>Projects</span></h2>
            <div class="projects-grid" id="projects-grid">
                <!-- Data will be loaded here by app.js -->
                <p style="text-align: center; width: 100%; color: var(--text-secondary);">Loading projects...</p>
            </div>
        </section>
    </main>

    <!-- Floating WhatsApp Button -->
    <a href="#" id="whatsapp-float" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
        <ul class="bottom-nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i>Home</a></li>
            <li><a href="portfolio.html?user=saeed"><i class="fas fa-code"></i>Saeed</a></li>
            <li><a href="portfolio.html?user=naeem"><i class="fas fa-film"></i>Naeem</a></li>
            <li><a href="about.html"><i class="fas fa-info-circle"></i>About</a></li>
        </ul>
    </nav>

    <!-- Desktop Footer -->
    <footer class="desktop-footer">
        <p>&copy; 2024 S&N Portfolio. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- Custom JS -->
    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
